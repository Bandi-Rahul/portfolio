<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="1200" y2="530"/>
    <line x1="800" y1="0" x2="1200" y2="300"/>
    <line x1="0" y1="200" x2="800" y2="630"/>
    <line x1="0" y1="430" x2="400" y2="630"/>
  </g>
  <!-- Accent circle -->
  <circle cx="980" cy="315" r="180" fill="#2563eb" opacity="0.08"/>
  <circle cx="980" cy="315" r="120" fill="#2563eb" opacity="0.05"/>
  <!-- Initials badge -->
  <rect x="80" y="160" width="72" height="72" rx="14" fill="#2563eb"/>
  <text x="116" y="208" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">RB</text>
  <!-- Name -->
  <text x="80" y="300" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#e5e5e5" letter-spacing="-1.5">Rahul Bandi</text>
  <!-- Title -->
  <text x="80" y="350" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a0a0a0">Software Technician · Build &amp; Release · Automation</text>
  <!-- Tagline -->
  <text x="80" y="400" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#707070">I build reliable systems and automate complex workflows.</text>
  <!-- Bottom accent line -->
  <rect x="80" y="460" width="120" height="3" rx="1.5" fill="#2563eb"/>
  <!-- Tech tags -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500">
    <rect x="80" y="485" width="70" height="28" rx="4" fill="#1e1e2e" stroke="#2a2a2a" stroke-width="1"/>
    <text x="115" y="504" fill="#a0a0a0" text-anchor="middle">Python</text>
    <rect x="162" y="485" width="62" height="28" rx="4" fill="#1e1e2e" stroke="#2a2a2a" stroke-width="1"/>
    <text x="193" y="504" fill="#a0a0a0" text-anchor="middle">CI/CD</text>
    <rect x="236" y="485" width="100" height="28" rx="4" fill="#1e1e2e" stroke="#2a2a2a" stroke-width="1"/>
    <text x="286" y="504" fill="#a0a0a0" text-anchor="middle">Azure DevOps</text>
    <rect x="348" y="485" width="95" height="28" rx="4" fill="#1e1e2e" stroke="#2a2a2a" stroke-width="1"/>
    <text x="395.5" y="504" fill="#a0a0a0" text-anchor="middle">Automation</text>
  </g>
</svg>
